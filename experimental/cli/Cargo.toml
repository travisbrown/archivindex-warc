[package]
name = "archivindex-archiver-cli"
description = "A command-line tool for archiving URLs into WARC files"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "archivindex-archiver"
path = "src/main.rs"
# Avoid a rustdoc output-filename collision with the `archivindex-archiver` library crate.
doc = false

[features]
# Browser-derived TLS emulation with HTTP/2 support. Compiles BoringSSL from source.
wreq = ["dep:archivindex-archiver-wreq"]
# Compile SQLite from source rather than linking the system library.
bundled = ["archivindex-archiver/bundled"]

[dependencies]
anyhow = "1"
archivindex-archiver.workspace = true
archivindex-archiver-wreq = { workspace = true, optional = true }
archivindex-cli-support.workspace = true
clap.workspace = true
log.workspace = true
