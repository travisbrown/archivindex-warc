[package]
workspace = ".."
name = "archivindex-archiver-wreq"
description = "An HTTP/1 and HTTP/2 archiver backend using BoringSSL and browser emulation"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
archivindex-archiver.workspace = true
archivindex-warc.workspace = true
chrono = "0.4"
fluent-uri.workspace = true
http.workspace = true
http-body-util = "0.1"
serde = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Redirected to the observer-enabled fork by the workspace patch; see README.md.
wreq = { version = "=0.16.1", default-features = false, features = [
  "tokio-rt",
  "webpki-roots",
  "socks",
] }
# The finalized-header callback used by wreq itself.
wreq-proto = "=0.2.6"
wreq-util = { version = "=0.2.0", default-features = false, features = [
  "emulation",
  "emulation-serde",
] }

[dev-dependencies]
tempfile.workspace = true
archivindex-test-support.workspace = true
data-encoding = "2"
rcgen = "0.14"
rustls = "0.23.45"
serde_json = "1"

# Local TLS HTTP/2 fixtures.
h2 = "0.4.19"
tokio-rustls = "0.26.5"
tokio = { version = "1", features = ["net"] }
