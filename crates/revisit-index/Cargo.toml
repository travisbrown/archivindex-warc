[package]
name = "archivindex-warc-revisit-index"
description = "A revisit index over WARC records: payload sources and conditional-request state"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-warc-revisit-index/"
keywords = ["warc", "web", "archive", "revisit", "sqlite"]
categories = ["caching", "database", "web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Compile SQLite from source rather than linking the system library. Off by default: a library
# should not choose how the final binary gets SQLite.
bundled = ["rusqlite/bundled"]

[dependencies]
archivindex-warc = { workspace = true, features = ["http"] }
fluent-uri.workspace = true
rusqlite = "0.40"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true
test-strategy.workspace = true
