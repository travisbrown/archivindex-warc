[package]
name = "archivindex-archiver"
description = "Archiving web pages over HTTP into WARC files"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-archiver/"
keywords = ["warc", "web", "archive", "http"]
categories = ["web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Passed through to the revisit index, which passes it through to rusqlite.
bundled = ["archivindex-warc-revisit-index/bundled"]

[dependencies]
archivindex-warc-revisit-index = { version = "0.1.0", path = "../revisit-index/" }
archivindex-warc = { workspace = true, features = [
  "gzip",
  "http",
  "payload-identification",
  "serde",
] }
chrono.workspace = true
data-encoding.workspace = true
fluent-uri.workspace = true
http.workspace = true
# Durations in configuration files are written as `humantime` strings, such as `30s`.
humantime-serde = "1"
rustls = "0.23"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
webpki-roots = "1"

[dev-dependencies]
archivindex-test-support.workspace = true
proptest.workspace = true
# The recorder's TLS test serves a self-signed certificate.
rcgen = "0.14"
test-strategy.workspace = true
