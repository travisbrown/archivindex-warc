[package]
name = "archivindex-archiver"
description = "Archiving web pages over HTTP into WARC files"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-archiver/"
keywords = ["warc", "web", "archive", "http"]
categories = ["web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Passed through to the revisit index, which passes it through to rusqlite.
bundled = ["archivindex-warc-revisit-index/bundled"]

[dependencies]
archivindex-http.workspace = true
archivindex-http-client.workspace = true
archivindex-http-client-challenge.workspace = true
archivindex-publication.workspace = true
archivindex-warc-identifier.workspace = true
archivindex-warc-revisit-index = { version = "0.1.0", path = "../archivindex-warc-revisit-index/" }
archivindex-warc = { workspace = true, features = ["gzip", "payload-identification", "serde"] }
chrono.workspace = true
fluent-uri.workspace = true
http.workspace = true
# Durations in configuration files are written as `humantime` strings, such as `30s`.
humantime-serde = "1"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
data-encoding.workspace = true
archivindex-test-support.workspace = true
proptest.workspace = true
wiremock.workspace = true
