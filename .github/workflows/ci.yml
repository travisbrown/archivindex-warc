name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo +nightly fmt --all -- --check
      - name: Check validator formatting
        run: cargo +nightly fmt --manifest-path validator/Cargo.toml --all -- --check

  build:
    name: Build, test, lint, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@cargo-hack
      # Every package on its own, with no features, its defaults, and each pair of features.
      - name: Lint every feature combination
        run: >-
          cargo hack clippy --locked --workspace --feature-powerset --depth 2
          --all-targets -- -D warnings
      - name: Lint library with all features
        run: >-
          cargo clippy --locked -p archivindex-warc
          --all-targets --all-features -- -D warnings
      - name: Check workspace documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check library documentation with all features
        run: cargo doc --locked -p archivindex-warc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build workspace targets
        run: cargo build --locked --workspace --all-targets
      - name: Build library targets with all features
        run: cargo build --locked -p archivindex-warc --all-targets --all-features
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test library with all features
        run: cargo test --locked -p archivindex-warc --all-features
      - name: Test library without default features
        run: cargo test --locked -p archivindex-warc --no-default-features
      - name: Run examples
        run: ./examples/run.sh

  validator:
    name: Build, test, and lint the validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: validator -> target
      - name: Lint validator
        run: >-
          cargo clippy --locked --manifest-path validator/Cargo.toml
          --all-targets -- -D warnings
      - name: Test validator
        run: cargo test --locked --manifest-path validator/Cargo.toml

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Check library with all features
        run: cargo check --locked -p archivindex-warc --all-targets --all-features

  platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test library with all features
        run: cargo test --locked -p archivindex-warc --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate library coverage
        run: >-
          cargo llvm-cov -p archivindex-warc --all-features --lcov
          --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fork pull requests do not have access to the token.
          fail_ci_if_error: false
