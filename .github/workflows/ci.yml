name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo +nightly fmt --all -- --check
      - name: Check validator formatting
        run: cargo +nightly fmt --manifest-path validator/Cargo.toml --all -- --check

  build:
    name: Build, test, lint, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@cargo-hack
      # Every package on its own, with no features, its defaults, and each pair of features.
      - name: Lint every feature combination
        run: >-
          cargo hack clippy --locked --workspace --feature-powerset --depth 2
          --all-targets -- -D warnings
      - name: Lint library with all features
        run: >-
          cargo clippy --locked -p archivindex-warc
          --all-targets --all-features -- -D warnings
      - name: Check workspace documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check library documentation with all features
        run: cargo doc --locked -p archivindex-warc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build workspace targets
        run: cargo build --locked --workspace --all-targets
      - name: Build library targets with all features
        run: cargo build --locked -p archivindex-warc --all-targets --all-features
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test library with all features
        run: cargo test --locked -p archivindex-warc --all-features
      - name: Test library without default features
        run: cargo test --locked -p archivindex-warc --no-default-features
      - name: Run examples
        run: ./examples/run.sh

  package:
    name: Package the publishable crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # Exclude unpublished packages because their path dependencies cannot meet Cargo's packaging
      # requirements. Skip verification because the workspace packages are not yet on the registry.
      - name: Package
        run: >-
          cargo package --locked --workspace --no-verify
          --exclude archivindex-cli-support
          --exclude archivindex-test-support
          --exclude archivindex-warc-ops
          --exclude archivindex-warc-cli

  deny:
    name: Check the dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check the workspace
        run: cargo deny --workspace check
      # The validator resolves on its own, so its tree is checked against the same policy.
      - name: Check the validator
        run: cargo deny --manifest-path validator/Cargo.toml --config deny.toml check

  validator:
    name: Build, test, and lint the validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: validator -> target
      - name: Lint validator
        run: >-
          cargo clippy --locked --manifest-path validator/Cargo.toml
          --all-targets -- -D warnings
      - name: Test validator
        run: cargo test --locked --manifest-path validator/Cargo.toml
      - name: Build validator
        run: cargo build --locked --manifest-path validator/Cargo.toml
      # The validators that need no installation, over the fixtures every one of them accepts.
      - name: Validate fixtures
        run: |
          for fixture in \
            tests/data/pywb/httpbin-resource.warc.gz \
            tests/data/pywb/post-test.warc.gz \
            tests/data/warcio/example-resource.warc.gz \
            tests/data/warcio/post-test.warc.gz
          do
            validator/target/debug/archivindex-warc-validator --no-install \
              --validator archivindex-raw --validator archivindex-untyped \
              --validator archivindex-record --validator warc --validator warcat-rs \
              "$fixture" || exit 1
          done

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Check library with all features
        run: cargo check --locked -p archivindex-warc --all-targets --all-features

  platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test library with all features
        run: cargo test --locked -p archivindex-warc --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate workspace coverage
        run: >-
          cargo llvm-cov --locked --workspace --all-features --lcov
          --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fork pull requests do not have access to the token.
          fail_ci_if_error: false
