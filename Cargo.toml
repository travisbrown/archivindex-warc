[package]
name = "warc"
version = "0.4.0"
description = "A Rust library for reading and writing WARC files."
readme = "README.md"
repository = "https://github.com/jedireza/warc"
documentation = "https://docs.rs/crate/warc/"
license = "MIT"
authors = ["Reza Akhavan <reza@akhavan.me>"]
keywords = ["warc", "web", "archive"]
edition = "2018"

[dependencies]
chrono = "0.4.11"
nom = "7.1.3"
url = "2"
uuid = { version = "0.8.1", features = ["v4"] }

[dependencies.libflate]
version = "2"
optional = true

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[features]
default = ["gzip"]
gzip = ["libflate"]
with_serde = ["serde"]

# These examples demonstrate gzip-compressed WARC files, so they are only built when the
# feature they require is enabled; the remaining examples are still auto-discovered.
[[example]]
name = "read_gzip"
required-features = ["gzip"]

[[example]]
name = "write_gzip"
required-features = ["gzip"]

[[example]]
name = "read_filtered"
required-features = ["gzip"]
