[workspace]
members = [".", "cli", "cli-support", "digest", "ops", "test-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/travisbrown/archivindex-warc"

[workspace.dependencies]
archivindex-cli-support = { path = "cli-support" }
archivindex-test-support = { path = "test-support" }
archivindex-warc = { version = "0.1.0", path = "." }
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
fluent-uri = "0.4"
log = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[package]
name = "archivindex-warc"
version.workspace = true
description = "A Rust library for reading and writing WARC files"
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-warc/"
license.workspace = true
authors = [
  "Reza Akhavan <reza@akhavan.me>",
  "Travis Brown <travisrobertbrown@gmail.com>",
]
keywords = ["warc", "web", "archive"]
categories = ["encoding", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["gzip"]
# Enable every supported digest algorithm.
all-digests = ["archivindex-warc-digest/all-digests"]
gzip = ["dep:flate2"]
http = ["dep:http"]
# `serde` supplies `IgnoredAny` for validating JSON without building a document.
payload-identification = ["dep:file-format", "dep:serde", "dep:serde_json"]
recorder = ["http", "dep:rustls", "dep:webpki-roots"]
# Enables Serde derives and conversion between types and `application/warc-fields` bodies.
serde = ["dep:serde"]

[dependencies]
archivindex-warc-digest = { version = "0.1.0", path = "digest" }
chrono = "0.4"
# `reader` adds content-based checks for formats that signatures alone cannot identify.
file-format = { version = "0.29", optional = true, features = ["reader"] }
flate2 = { workspace = true, optional = true }
fluent-uri.workspace = true
http = { version = "1", optional = true }
# Vectorized newline scanning in the reader's line loop.
memchr = "2.8"
rustls = { version = "0.23", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
# A builder not told a record identifier generates one, which is a version 4 UUID.
uuid = { version = "1", features = ["v4"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
data-encoding.workspace = true
proptest.workspace = true
# The recorder's TLS test serves a self-signed certificate.
rcgen = "0.14"
# The request-reconstruction test compares against bytes sent by a real loopback client.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
] }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
test-strategy.workspace = true
# Only the `read_filtered` example parses URLs.
url = "2"
# The upstream crate this one is derived from, compared against by `warc_crate_roundtrip`.
# Pinned exactly, since that test asserts the behavior of one specific implementation.
warc = "=0.4.0"

[[test]]
name = "reconstruct_request_echo"
required-features = ["http"]

[[test]]
name = "recorder_loopback"
required-features = ["recorder"]

# These examples demonstrate gzip-compressed WARC files, so they are only built when the
# feature they require is enabled; the remaining examples are still auto-discovered.
[[example]]
name = "read_gzip"
required-features = ["gzip"]

[[example]]
name = "write_gzip"
required-features = ["gzip"]

[[example]]
name = "read_filtered"
required-features = ["gzip"]
