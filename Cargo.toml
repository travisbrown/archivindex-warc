[package]
name = "archivindex-warc"
version = "0.4.0"
description = "A Rust library for reading and writing WARC files"
readme = "README.md"
repository = "https://github.com/travisbrown/archivindex-warc"
documentation = "https://docs.rs/crate/archivindex-warc/"
license = "MIT"
authors = [
    "Reza Akhavan <reza@akhavan.me>",
    "Travis Brown <travisrobertbrown@gmail.com>",
]
keywords = ["warc", "web", "archive"]
edition = "2024"
rust-version = "1.85"

[features]
default = ["gzip"]
gzip = ["dep:flate2"]
serde = ["dep:serde"]

[dependencies]
chrono = "0.4"
flate2 = { version = "1", optional = true }
fluent-uri = "0.4"
nom = "8"
serde = { version = "1", optional = true, features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
data-encoding = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
tempfile = "3"
# Only the `read_filtered` example parses URLs.
url = "2"
# The upstream crate this one is derived from, compared against by `warc_crate_roundtrip`.
# Pinned exactly, since that test asserts the behavior of one specific implementation.
warc = "=0.4.0"

# These examples demonstrate gzip-compressed WARC files, so they are only built when the
# feature they require is enabled; the remaining examples are still auto-discovered.
[[example]]
name = "read_gzip"
required-features = ["gzip"]

[[example]]
name = "write_gzip"
required-features = ["gzip"]

[[example]]
name = "read_filtered"
required-features = ["gzip"]
