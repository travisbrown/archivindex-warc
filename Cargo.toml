[workspace]
members = [
  ".",
  "crates/archivindex-archiver",
  "crates/archivindex-warc-digest",
  "crates/archivindex-warc-identifier",
  "crates/archivindex-warc-linter",
  "crates/archivindex-warc-ops",
  "crates/archivindex-warc-revisit-index",
  "tools/archivindex-archiver-cli",
  "tools/archivindex-warc-cli",
]
default-members = [
  ".",
  "crates/archivindex-archiver",
  "crates/archivindex-warc-digest",
  "crates/archivindex-warc-identifier",
  "crates/archivindex-warc-linter",
  "crates/archivindex-warc-ops",
  "crates/archivindex-warc-revisit-index",
  "tools/archivindex-archiver-cli",
  "tools/archivindex-warc-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
edition = "2024"
rust-version = "1.98"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/travisbrown/archivindex-warc"

[workspace.dependencies]
archivindex-archiver = { version = "0.1.0", path = "crates/archivindex-archiver" }
archivindex-cli-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-http = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http-client = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http-client-challenge = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-publication = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-test-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-warc = { version = "0.1.0", path = "." }
archivindex-warc-identifier = { version = "0.1.0", path = "crates/archivindex-warc-identifier" }
archivindex-warc-linter = { version = "0.1.0", path = "crates/archivindex-warc-linter" }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
fluent-uri = "0.4"
http = "1"
log = "0.4"
proptest = { version = "1.12", features = ["attr-macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
url = "2"
wiremock = "0.6.5"

# The optional wreq backend needs observer hooks from a fork. Repeat the HTTP client
# workspace patches here because Cargo ignores patches declared by dependencies.
[patch.crates-io]
wreq = { git = "https://github.com/travisbrown/wreq", rev = "729e006cf6f48fb4509147a2e1b7cba2f73699de" }

# Match the emulation profiles to the fork's TLS and HTTP/2 APIs.
wreq-util = { git = "https://github.com/travisbrown/wreq-util", rev = "69af0555e88cb2882de7a4250a40a828d7eb9a61" }

# Use the TLS and HTTP codec revisions pinned by the observer fork.
btls = { git = "https://github.com/0x676e67/btls", rev = "8879c026b548c25441f83ff58b39d7e22ba1b5b1" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "8879c026b548c25441f83ff58b39d7e22ba1b5b1" }
tokio-btls = { git = "https://github.com/0x676e67/btls", rev = "8879c026b548c25441f83ff58b39d7e22ba1b5b1" }
http2 = { git = "https://github.com/0x676e67/http2", rev = "3219d38910c22105ea7fc5464696f26589432e9c" }
netty = { git = "https://github.com/0x676e67/netty", rev = "314db585d85e7ea9c15535f458e7324b800fc702" }

[[workspace.metadata.archivindex-build.exemptions]]
package = "archivindex-warc"
rule = "package.authors"
reason = "The library derives from the `warc` crate and keeps its author."

[[workspace.metadata.archivindex-build.exemptions]]
package = "archivindex-warc"
rule = "package.license"
reason = "The library derives from the `warc` crate and keeps its license."

[[workspace.metadata.archivindex-build.exemptions]]
package = "archivindex-warc-digest"
rule = "package.license"
reason = "Split out of `archivindex-warc`, so it keeps that crate's license."

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[package]
name = "archivindex-warc"
version.workspace = true
description = "A Rust library for reading and writing WARC files"
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-warc/"
# The library derives from the `warc` crate and keeps its license, and so does the digest crate
# split out of it; the other packages are GPL.
license = "MIT"
authors = ["Reza Akhavan <reza@akhavan.me>", "Travis Brown <travisrobertbrown@gmail.com>"]
keywords = ["warc", "web", "archive"]
categories = ["encoding", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["gzip"]
# Enable every supported digest algorithm.
all-digests = ["archivindex-warc-digest/all-digests"]
gzip = ["dep:flate2"]
# `serde` supplies `IgnoredAny` for validating JSON without building a document.
payload-identification = ["dep:file-format", "dep:serde", "dep:serde_json"]
# Enables Serde derives and conversion between types and `application/warc-fields` bodies.
serde = ["dep:serde", "archivindex-warc-digest/serde"]

[dependencies]
archivindex-http.workspace = true
archivindex-warc-digest = { version = "0.1.0", path = "crates/archivindex-warc-digest" }
chrono.workspace = true
# `reader` adds content-based checks for formats that signatures alone cannot identify.
file-format = { version = "0.29", optional = true, features = ["reader"] }
flate2 = { workspace = true, optional = true }
fluent-uri.workspace = true
# Vectorized newline scanning in the reader's line loop.
memchr = "2.8"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
# Builders generate a version 4 UUID when no record identifier is supplied.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
data-encoding.workspace = true
proptest.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
# Only the `read_filtered` example parses URLs.
url.workspace = true
# Pin the upstream implementation used by `warc_crate_roundtrip` for reproducible comparisons.
warc = "=0.4.0"

# Gzip examples require the `gzip` feature. Other examples are auto-discovered.
[[example]]
name = "read_gzip"
required-features = ["gzip"]

[[example]]
name = "write_gzip"
required-features = ["gzip"]

[[example]]
name = "read_filtered"
required-features = ["gzip"]
