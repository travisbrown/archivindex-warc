[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # The graph renderer `d2-little` depends on `ttf-parser`.
  { id = "RUSTSEC-2026-0192", reason = "`ttf-parser` is unmaintained" },
  # The standalone comparison validator uses warcat 0.3.4, which requires zstd 0.13.
  # Accept these advisories until warcat upgrades; retain its Zstandard support.
  { id = "RUSTSEC-2026-0391", reason = "warcat's zstd requirement prevents the fixed 0.14.3 release" },
  { id = "RUSTSEC-2026-0398", reason = "warcat's zstd requirement prevents the fixed zstd-safe 8.2.0 release" },
  { id = "RUSTSEC-2026-0403", reason = "warcat's zstd requirement prevents the fixed zstd-safe 8.2.0 release" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency on a package that is never published cannot carry a version requirement.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Every package but the `archivindex-warc` library and its digest crate uses GPL-3.0-only; those two
# and the third-party dependencies use only the licenses allowed above.
exceptions = [
  { crate = "archivindex-http-client-challenge", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-archiver", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-http-client", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-archiver-cli", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-warc-cli", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-warc-identifier", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-warc-linter", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-warc-ops", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-warc-revisit-index", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-warc-validator", allow = [
    "GPL-3.0-only",
  ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The shared Archivindex packages, observer-enabled wreq fork, unreleased btls APIs, and
# upstream wreq-util dependency fixes.
allow-git = [
  "https://github.com/travisbrown/archivindex",
  "https://github.com/travisbrown/wreq",
  "https://github.com/0x676e67/btls",
  "https://github.com/0x676e67/wreq-util",
]
