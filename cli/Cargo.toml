[package]
name = "archivindex-warc-cli"
version.workspace = true
description = "Command-line tools for working with WARC files"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Passed through to the revisit index, which passes it through to rusqlite.
bundled = ["archivindex-warc-revisit-index/bundled"]

[dependencies]
anyhow = "1"
archivindex-cli-support.workspace = true
archivindex-warc.workspace = true
archivindex-warc-ops = { path = "../ops" }
archivindex-warc-revisit-index = { version = "0.1.0", path = "../revisit-index/" }
clap.workspace = true
csv = "1"
d2-little = "0.7.1-1"
flate2.workspace = true
fluent-uri.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
archivindex-test-support.workspace = true
tempfile.workspace = true
