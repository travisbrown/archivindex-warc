[package]
name = "archivindex-warc-cli"
version = "0.1.0"
description = "Command-line tools for working with WARC files"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
archivindex-warc = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
log = "0.4"
simplelog = "0.12"

[dev-dependencies]
tempfile = "3"
