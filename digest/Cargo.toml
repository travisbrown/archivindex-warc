[package]
name = "archivindex-warc-digest"
version.workspace = true
description = "WARC labelled-digest values and encodings"
categories = ["cryptography", "encoding"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["md5", "sha1", "sha2"]
md5 = ["dep:md-5"]
sha1 = ["dep:sha1"]
sha2 = ["dep:sha2"]
sha3 = ["dep:sha3"]
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]
xxh3 = ["dep:xxhash-rust"]
all-digests = ["md5", "sha1", "sha2", "sha3", "blake2", "blake3", "xxh3"]

[dependencies]
blake2 = { version = "0.11.0-rc.6", optional = true }
blake3 = { version = "1.8.7", optional = true }
data-encoding.workspace = true
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { workspace = true, optional = true }
sha3 = { version = "0.12", optional = true }
thiserror.workspace = true
xxhash-rust = { version = "0.8.18", optional = true, features = ["xxh3"] }

[dev-dependencies]
proptest.workspace = true
test-strategy.workspace = true
