[package]
name = "archivindex-warc-validator"
version = "0.1.0"
description = "Validate WARC files with several independent validators"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
# The crate under test, read from its own source tree rather than from a published release.
archivindex-warc = { path = ".." }
# warcat 0.3.4 enables blake3's experimental digest traits, which became incompatible with its
# digest 0.10 dependency in later blake3 releases.
blake3 = { version = "=1.5.4", features = ["pure", "traits-preview"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
ureq = "3"
warc = "=0.4.0"
warcat = "0.3.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
