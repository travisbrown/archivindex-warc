# This package builds on its own, outside the repository's workspace, so that its dependency
# tree cannot constrain the other packages.
[workspace]

[package]
name = "archivindex-warc-validator"
version = "0.1.0"
description = "Validate WARC files with several independent validators"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/travisbrown/archivindex-warc"
publish = false

[lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[dependencies]
anyhow = "1"
# The command-line behavior the repository's other applications share.
archivindex-cli-support = { path = "../cli-support" }
# The crate under test, read from its own source tree rather than from a published release.
archivindex-warc = { path = ".." }
# warcat 0.3.4 enables blake3's experimental digest traits, which became incompatible with its
# digest 0.10 dependency in later blake3 releases.
blake3 = { version = "=1.5.4", features = ["pure", "traits-preview"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
ureq = "3"
warc = "=0.4.0"
warcat = "0.3.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
