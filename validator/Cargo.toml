[package]
name = "archivindex-warc-validator"
version.workspace = true
description = "Validate WARC files with several independent validators"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# The crate under test, read from its own source tree rather than from a published release.
archivindex-warc.workspace = true
# warcat 0.3.4 enables blake3's experimental digest traits, which became incompatible with its
# digest 0.10 dependency in later blake3 releases.
blake3 = { version = "=1.5.4", features = ["pure", "traits-preview"] }
clap.workspace = true
directories = "6"
flate2.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
simplelog.workspace = true
tar = "0.4"
tempfile.workspace = true
ureq = "3"
warc.workspace = true
warcat = "0.3.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
